[versions]
# App version: the single source of versionName/versionCode (app/build.gradle.kts).
appVersionName = "0.6.2"
appVersionCode = "10"
agp = "9.4.1"
kotlin = "2.4.21"
junit = "5.13.4"
junitPlatform = "1.13.4"
junit4 = "4.13.2"
androidxCore = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
customview = "1.2.0"
autofill = "1.3.0"
navigation3 = "1.2.0"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-customview = { module = "androidx.customview:customview", version.ref = "customview" }
androidx-autofill = { module = "androidx.autofill:autofill", version.ref = "autofill" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
