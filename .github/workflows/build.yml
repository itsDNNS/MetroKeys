name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: 'false'

      # Caches the Gradle distribution and dependencies and validates the Gradle wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and build the debug APK
        run: ./gradlew :engine:test testDebugUnitTest lintDebug assembleDebug

      # Dictionary evaluation (spec 05c, docs/EVALUATION.md): lint and the fast tier on every push and pull request,
      # the full tier (both halves, both profiles, freshness run) on release tags. Report-only in 0.7.0.
      - name: Dictionary evaluation, fast tier
        run: ./gradlew :engine:evalFast

      - name: Dictionary evaluation, full tier
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :engine:evalFull

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: metrokeys-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            engine/build/reports/
            app/build/test-results/
            engine/build/test-results/
            engine/build/evaluation/
          if-no-files-found: warn

