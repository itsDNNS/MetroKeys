name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: 'false'

      # Caches the Gradle distribution and dependencies and validates the Gradle wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and build the debug APK
        run: ./gradlew :engine:test testDebugUnitTest lintDebug assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: metrokeys-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            engine/build/reports/
            app/build/test-results/
            engine/build/test-results/
          if-no-files-found: warn

  release:
    # Version tags additionally build the release APK and attach it to a draft GitHub release. CI has no
    # keystore.properties, so this APK is unsigned; sign it locally before publishing.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk "metrokeys-${GITHUB_REF_NAME}-unsigned.apk"

      - name: Create a draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: MetroKeys ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: metrokeys-${{ github.ref_name }}-unsigned.apk
